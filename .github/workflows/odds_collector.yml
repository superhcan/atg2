name: ATG JIT Odds Monitor

on:
  schedule:
    - cron: '30 8 * * *'   # Pass 1: 09:30 CET (Lunch/EM)
    - cron: '0 14 * * *'   # Pass 2: 15:00 CET (EM/Kväll)
    - cron: '30 18 * * *'  # Pass 3: 19:30 CET (Sen kväll + slutresultat)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360 # GitHubs hårda maxgräns (6 timmar)
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests pandas pyarrow duckdb
        
      - name: Run JIT Odds Monitor & Update Silver/Gold
        env:
          MONITOR_DURATION_HOURS: 5.85 # 5h 51m (lämnar 9 min marginal för start + slutjobb)
        run: |
          export PYTHONPATH=.
          # Kör bevakaren i bakgrunden och spara loggen till fil
          python3 src/data/odds_monitor.py > monitor.log 2>&1 &
          PID=$!
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          SECONDS_PASSED=0
          # Kolla var 30:e sekund om Python-skriptet är klart (eliminerar 10-minuters väntetid)
          while kill -0 $PID 2>/dev/null; do
            sleep 30
            SECONDS_PASSED=$((SECONDS_PASSED + 30))
            
            # Pusha rådata var 10:e minut (600 sekunder)
            if [ $SECONDS_PASSED -ge 600 ]; then
              SECONDS_PASSED=0
              git pull --rebase origin master || echo "Rebase failed, skipping this push"
              git add data/warehouse/bronze/
              git commit -m "Automated JIT odds snapshot [skip ci]" || echo "No changes"
              git push origin master || echo "Push failed, retrying"
              
              echo "--- Latest log entries ---"
              tail -n 20 monitor.log
            fi
          done
          
          echo "--- Final monitor log ---"
          tail -n 20 monitor.log
          
          # När passet avslutas: Hämta slutresultat och uppdatera Silver + Gold (inkl. oddstrender)
          python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from src.data.atg_collector import ATGClient
          from src.data.silver_parser import SilverParser
          from src.data.gold_analyzer import GoldAnalyzer
          
          today = datetime.now(ZoneInfo('Europe/Stockholm')).strftime('%Y-%m-%d')
          print(f'Uppdaterar Bronze/Silver/Gold för {today}...')
          ATGClient().crawl_day(today)
          parser = SilverParser()
          parser.parse_games_to_races(today)
          parser.parse_results(today)
          parser.parse_odds_time_series(today)
          GoldAnalyzer().create_daily_summary(today)
          "
          
          # Sista pushen sparar både bronze, silver och gold
          git pull --rebase origin master || echo "Final rebase failed"
          git add data/warehouse/
          git commit -m "Final JIT odds & Silver/Gold update [skip ci]" || echo "No changes"
          git push origin master || echo "Final push failed"
