name: ATG JIT Odds Monitor

on:
  schedule:
    - cron: '30 8 * * *'   # 09:30 CET / 10:30 CEST (Lunch/EM)
    - cron: '30 14 * * *'  # 15:30 CET / 16:30 CEST (EM/Kväll)
    - cron: '30 17 * * *'  # 18:30 CET / 19:30 CEST (Sen kväll - täcker till 00:30)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360 # GitHub max 6 timmar
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install requests pandas pyarrow duckdb
        
      - name: Run JIT Odds Monitor & Update Silver/Gold
        env:
          MONITOR_DURATION_HOURS: 6
        run: |
          export PYTHONPATH=.
          # Kör bevakaren i bakgrunden och spara loggen till fil
          python3 src/data/odds_monitor.py > monitor.log 2>&1 &
          
          # En loop som pushar bronze-data löpande var 10:e minut
          while kill -0 $! 2>/dev/null; do
            sleep 600
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            git pull --rebase origin master || echo "Rebase failed, skipping this push"
            git add data/warehouse/bronze/
            git commit -m "Automated JIT odds snapshot [skip ci]" || echo "No changes"
            git push origin master || echo "Push failed, retrying"
            
            # Visa de senaste raderna i loggen för webb-vyn
            echo "--- Latest log entries ---"
            tail -n 20 monitor.log
          done
          
          # När passet är klart: Hämta slutresultat och bygg Silver + Gold för idag
          python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from src.data.atg_collector import ATGClient
          from src.data.silver_parser import SilverParser
          from src.data.gold_analyzer import GoldAnalyzer
          
          today = datetime.now(ZoneInfo('Europe/Stockholm')).strftime('%Y-%m-%d')
          print(f'Uppdaterar Bronze/Silver/Gold för {today}...')
          ATGClient().crawl_day(today)
          parser = SilverParser()
          parser.parse_games_to_races(today)
          parser.parse_results(today)
          parser.parse_odds_time_series(today)
          GoldAnalyzer().create_daily_summary(today)
          "
          
          # En sista push när processen avslutas (inkluderar nu hela warehouse: bronze, silver, gold)
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull --rebase origin master || echo "Final rebase failed"
          git add data/warehouse/
          git commit -m "Final JIT odds & Silver/Gold update [skip ci]" || echo "No changes"
          git push origin master || echo "Final push failed"
